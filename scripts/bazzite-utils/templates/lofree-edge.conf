# Lofree Edge (Bluetooth, reports as Apple HID 05ac:024f). Keep this device
# on plain US punctuation regardless of the system's active XKB layout
# (currently "pt", used by the other keyboard). k: restricts the match to
# this device's keyboard interface (it also exposes a mouse-like
# volume-scroll interface under the same vendor:product).
#
# IMPORTANT: macro(<ascii char>) does NOT bypass the OS keymap - it presses
# whatever keycode+shift produces that char on a standard US layout, and
# the ACTIVE "pt" layout then reinterprets that raw keycode. So most lines
# below request a DIFFERENT character than the one that should appear,
# chosen (via /usr/share/X11/xkb/symbols/pt + live testing) so that pt's
# reinterpretation lands on the right-hand character. Do not "simplify"
# these to macro(<the char you actually want>) - that's the bug this file
# works around. Brackets/braces/@ live behind PT's AltGr layer, so those
# use raw keycode + G-/S- (AltGr/Shift) modifiers instead.
#
# HARDWARE QUIRK: this board's grave and apostrophe keys are swapped at the
# scancode level - pressing the key printed ' sends KEY_GRAVE, and the key
# printed ` sends KEY_APOSTROPHE (confirmed by live testing 2026-09-11,
# consistent with the Apple-HID/ISO oddities noted during the original
# investigation). That's why the bindings below look backwards: the
# [main]/[shift] grave entries produce the APOSTROPHE-key's characters and
# vice versa. Don't "fix" this to look symmetric - it's intentional.
#
# DEAD KEYS: PT has no literal `, ~ or ^ anywhere in this table - only as
# the "spacing form" of a dead key (dead_grave/dead_tilde/dead_circumflex),
# committed once a non-combining key follows. macro(\ space) below
# explicitly supplies that completion key itself rather than relying on
# whatever the user happens to type next - without it, shift+grave (the
# apostrophe-key target ~) stayed pending/blank if nothing suitable
# followed (confirmed live 2026-09-11). ` and ^ haven't shown the same
# flakiness yet but rely on the same mechanism; if either ever shows
# blank, apply the same "<char> space" fix there.
#
# KNOWN KEYD BUG (v2.6.0): macro(102nd) / macro(S-102nd) segfaults the
# daemon (crashes process_event, confirmed via coredump - not a config
# error, `keyd check` passes fine). Work around it by binding the PLAIN
# unwrapped key name (102nd / S-102nd) instead of wrapping it in macro() -
# that path doesn't crash. Don't "clean this up" into macro() form.
[ids]
k:05ac:024f

[main]
grave = macro(-)
minus = macro(/)
equal = macro())
leftbrace = macro(G-8)
rightbrace = macro(G-9)
semicolon = macro(<)
apostrophe = macro(})
backslash = macro(`)
slash = macro(&)

[shift]
grave = macro(@)
2 = macro(G-2)
6 = macro(|)
7 = macro(^)
8 = macro({)
9 = macro(*)
0 = macro(()
minus = macro(?)
equal = macro([)
leftbrace = macro(G-7)
rightbrace = macro(G-0)
semicolon = macro(>)
apostrophe = macro(\ space)
backslash = macro(~)
comma = 102nd
dot = S-102nd
slash = macro(_)
