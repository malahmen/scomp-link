# marker ingestion service (Docker) — Redis queue + API + scalable workers.
#
#   docker compose up -d --build                 # start (2 workers)
#   docker compose up -d --scale worker=4         # scale workers
#   docker compose run --rm api python enqueue_batch.py /data/input   # bulk ingest
#   docker compose logs -f worker
#   docker compose down
#
# Put source docs under ${MARKER_INPUT:-./input}; results land in
# ${MARKER_OUTPUT:-./output}. Models cache in the `models` volume (first run
# downloads several GB). GPU only applies on a CUDA host (see the worker note).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /data/output
    ports:
      - "8000:8000"
    volumes:
      - "${MARKER_INPUT:-./input}:/data/input"
      - "${MARKER_OUTPUT:-./output}:/data/output"
      - "models:/models"
    depends_on:
      - redis

  worker:
    build: .
    command: python worker.py
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /data/output
    volumes:
      - "${MARKER_INPUT:-./input}:/data/input"
      - "${MARKER_OUTPUT:-./output}:/data/output"
      - "models:/models"
    depends_on:
      - redis
    deploy:
      replicas: 2
      # GPU (uncomment on a host with the NVIDIA container runtime):
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]

volumes:
  redis-data: {}
  models: {}
