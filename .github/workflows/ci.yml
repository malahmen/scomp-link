name: ci

# Every push and pull request. The suite needs no network, no tokens, no
# terminal and no gum: tests/test-astromech.sh prepends tests/stubs to PATH, so
# a scripted stub answers every prompt and the engine under test is a recording
# wrapper. That is what makes a TUI repository testable on a runner at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engines the front-ends drive, checked out beside this repository
      # the way a user has them. Without them test-astromech.sh,
      # test-carbonite.sh and test-thermal-exhaust-port.sh found nothing to
      # drive, skipped, and run-all.sh printed PASS - 168 of 472 checks had
      # never run here (Kamino item 24). Their main, not a pin: the question
      # is whether the front-end works with the engine as it is now.
      - uses: actions/checkout@v4
        with: { repository: malahmen/astromech, path: _engines/astromech }
      - uses: actions/checkout@v4
        with: { repository: malahmen/carbonite, path: _engines/carbonite }
      - uses: actions/checkout@v4
        with: { repository: malahmen/thermal-exhaust-port, path: _engines/thermal-exhaust-port }

      - name: Versions
        # Printed because a suite that behaves differently on the runner than
        # on a workstation is the thing hardest to debug from a log alone.
        run: |
          bash --version | head -1
          git --version
          shellcheck --version | sed -n 2p

      - name: shellcheck
        # Found, not globbed. `scripts/*/*.sh` misses the four scripts at the
        # repository root, scripts/_templates, and scripts/starlight/converter —
        # six files that a named list or a one-level glob quietly stops covering.
        # tests/stubs/gum is added by name: it is bash with no .sh extension.
        #
        # -x so the `source ../_common/ui.sh` chain is followed; without it every
        # front-end reports a file of apparently undefined helpers.
        #
        # -S warning explicitly: SC2002 is off by default in shellcheck 0.11+ and
        # on in older releases, so the floor has to be pinned or the runner and
        # the workstation disagree about what passes.
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' -not -path './_engines/*' | sort)
          files+=(tests/stubs/gum)
          printf 'linting %d files\n' "${#files[@]}"
          shellcheck -S warning -x "${files[@]}"

      - name: tests
        # --strict: every file has what it needs here, so a skip is a fault.
        env:
          ASTROMECH: ${{ github.workspace }}/_engines/astromech/astromech.sh
          CARBONITE: ${{ github.workspace }}/_engines/carbonite
          TEP: ${{ github.workspace }}/_engines/thermal-exhaust-port/thermal-exhaust-port.sh
        run: tests/run-all.sh --strict
